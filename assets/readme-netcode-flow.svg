<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" role="img" aria-label="Peer to peer netcode flow">
  <rect width="980" height="360" rx="24" fill="#101114"/>
  <text x="490" y="42" text-anchor="middle" fill="#f4f1e8" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">How the peer-to-peer match starts</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="50" y="90" width="190" height="92" rx="10" fill="#20242a" stroke="#f5b83f"/>
    <text x="145" y="126" text-anchor="middle" fill="#f5b83f" font-size="18" font-weight="800">1. Host</text>
    <text x="145" y="154" text-anchor="middle" fill="#f4f1e8" font-size="14">Create invite code</text>
    <rect x="285" y="90" width="190" height="92" rx="10" fill="#20242a" stroke="#6ac7df"/>
    <text x="380" y="126" text-anchor="middle" fill="#6ac7df" font-size="18" font-weight="800">2. Guest</text>
    <text x="380" y="154" text-anchor="middle" fill="#f4f1e8" font-size="14">Paste invite</text>
    <rect x="520" y="90" width="190" height="92" rx="10" fill="#20242a" stroke="#6ac7df"/>
    <text x="615" y="126" text-anchor="middle" fill="#6ac7df" font-size="18" font-weight="800">3. Guest</text>
    <text x="615" y="154" text-anchor="middle" fill="#f4f1e8" font-size="14">Create answer code</text>
    <rect x="755" y="90" width="190" height="92" rx="10" fill="#20242a" stroke="#4ecb8f"/>
    <text x="850" y="126" text-anchor="middle" fill="#4ecb8f" font-size="18" font-weight="800">4. Link</text>
    <text x="850" y="154" text-anchor="middle" fill="#f4f1e8" font-size="14">Encrypted data channel</text>
    <path d="M240 136h45M475 136h45M710 136h45" stroke="#aaa79d" stroke-width="4" stroke-linecap="round"/>
    <path d="m278 126 13 10-13 10M513 126l13 10-13 10M748 126l13 10-13 10" fill="none" stroke="#aaa79d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="160" y="232" width="660" height="76" rx="10" fill="#1b2c29" stroke="#4ecb8f"/>
    <text x="490" y="263" text-anchor="middle" fill="#4ecb8f" font-size="18" font-weight="800">Commit / Reveal Fairness Step</text>
    <text x="490" y="291" text-anchor="middle" fill="#f4f1e8" font-size="14">Both players lock a seed hash, reveal the seed, verify it, then build the same board and dice rolls.</text>
  </g>
</svg>